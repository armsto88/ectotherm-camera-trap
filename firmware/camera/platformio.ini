; Camera controller: an ESP32-S3 that the beam watcher wakes, which takes the pictures and writes
; the records. Its logic sits in lib/ and is tested on the computer with `pio test -e native`.

[platformio]
default_envs = native

[env]
build_flags = -I../shared/include
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  rweather/Crypto@0.4.0

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -std=gnu++17 -Wall -Wextra -Werror -I test/shim
; The Crypto library declares no native platform; its sources build with the stand-in Arduino.h.
lib_compat_mode = off
extra_scripts = pre:quiet_libdeps.py
