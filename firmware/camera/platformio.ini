; Camera controller: an ESP32-S3 that the beam watcher wakes, which takes the pictures and writes
; the records. Its logic sits in lib/ and is tested on the computer with `pio test -e native`.

[platformio]
default_envs = native

[env]
build_flags = -I../shared/include
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  rweather/Crypto@0.4.0

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -std=gnu++17 -Wall -Wextra -Werror -I test/shim
; The Crypto library declares no native platform; its sources build with the stand-in Arduino.h.
lib_compat_mode = off
extra_scripts = pre:quiet_libdeps.py

; The prototype: the user's ESP32-S3-WROOM camera board with octal PSRAM (module N8R8 or N16R8;
; hardware/prototype/bring-up.md). Until the pass capture is written it builds the bring-up program
; in src/bringup/.
[env:prototype]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -D BOARD_HEADER=\"board_prototype.h\"
build_src_flags = -Wall -Wextra -Werror
build_src_filter = +<bringup/>
