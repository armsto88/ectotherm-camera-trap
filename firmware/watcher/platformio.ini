; Beam watcher: an ATtiny3216 that pulses the lasers, watches the PIR sensor and wakes the camera
; controller. Its logic sits in lib/ and is tested on the computer with `pio test -e native`.

[platformio]
default_envs = native

[env]
build_flags = -I../shared/include

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -std=gnu++17 -Wall -Wextra -Werror
