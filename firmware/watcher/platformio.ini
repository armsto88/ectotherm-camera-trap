; Beam watcher: an ATtiny3216 that pulses the lasers, watches the PIR sensor and wakes the camera
; controller. Its logic sits in lib/ and is tested on the computer with `pio test -e native`.

[platformio]
default_envs = native

[env]
build_flags = -I../shared/include

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -std=gnu++17 -Wall -Wextra -Werror

; The prototype: an ATtiny3216 on an adapter board at 3.3 V, programmed over UPDI through a
; USB-serial adapter (hardware/prototype/bring-up.md). Until the watcher firmware is written it
; builds the bring-up program in src/bringup/.
[env:prototype]
platform = atmelmegaavr@1.10.0
board = ATtiny3216
framework = arduino
board_build.f_cpu = 10000000L
upload_protocol = serialupdi
upload_speed = 230400
monitor_speed = 115200
build_flags = ${env.build_flags} -D BOARD_HEADER=\"board_prototype.h\"
build_src_flags = -Wall -Wextra -Werror
build_src_filter = +<bringup/>
