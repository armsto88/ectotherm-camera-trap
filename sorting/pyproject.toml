[project]
name = "trapsort"
version = "0.1.0"
description = "Reads, sorts, reviews and exports the pictures of an ectotherm camera trap"
requires-python = ">=3.11"
dependencies = ["pillow>=10"]

[project.scripts]
trapsort = "trapsort.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "frictionless>=5.21.0",
    "jsonschema>=4.26.0",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
